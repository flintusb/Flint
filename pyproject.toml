[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flint-usb"
dynamic = ["version"]
description = "Windows-native bootable USB & disk image writer with byte-level verification"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.6",
    "psutil>=5.9",
    "pywin32>=306; sys_platform == 'win32'",
    "wmi>=1.5; sys_platform == 'win32'",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    # R13: CI publishes wheels for cp310–cp313 only (cibuildwheel 2.22 caps at
    # 3.13, see .github/workflows/publish.yml). 3.14 is supported but served
    # via the sdist — pip on 3.14 builds from source locally.
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Software Distribution",
    "Topic :: System :: Recovery Tools",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://flintweb.vercel.app"
Repository = "https://github.com/flintusb/Flint"
Issues = "https://github.com/flintusb/Flint/issues"
Documentation = "https://flintweb.vercel.app/docs"

[project.scripts]
flint = "main:main"

[project.gui-scripts]
flintw = "main:gui_main"

[tool.setuptools]
packages = ["core", "ui"]
py-modules = ["main", "__main__"]
package-data = {"ui" = ["reference.html", "flint.ico"]}

[tool.setuptools.dynamic]
version = {attr = "core.version.APP_VERSION"}

[tool.cibuildwheel]
build = "cp3*-win_amd64"
environment = {CIBW_BUILD_VERBOSITY = "1"}
before-build = "python -m pip install --upgrade pip setuptools wheel"

[tool.ruff]
line-length = 88
extend-exclude = ["_regression.py"]

[tool.ruff.lint]
ignore = ["E203", "BLE001", "S110"]
